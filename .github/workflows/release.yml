name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Labels on the release PR go through the issues API.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The next release PR is opened in its own job, so its failure cannot skip the build of a
  # release that already exists. Nothing depends on it.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-please-pr-main
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # A tag pushed with GITHUB_TOKEN triggers no workflow, so the build runs in this run.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package-macos.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
    # The called job reads these from the `release` environment, but only the ones passed here.
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: release-artifacts
      - name: Verify the downloaded assets
        working-directory: release-artifacts
        run: |
          sha256sum -c SHA256SUMS.txt
          listed="$( (sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS.txt; echo SHA256SUMS.txt) | LC_ALL=C sort)"
          present="$(shopt -s dotglob nullglob; printf '%s\n' * | LC_ALL=C sort)"
          if [ "${present}" != "${listed}" ]; then
            printf 'The artifact must hold exactly SHA256SUMS.txt and the files it lists.\nListed:\n%s\nPresent:\n%s\n' "${listed}" "${present}"
            exit 1
          fi
      - name: Upload the release assets
        run: gh release upload "${TAG}" release-artifacts/* --clobber
      - name: Add the install notice to the release notes
        run: |
          marker='<!-- figma-drop-install-notice -->'
          version="${TAG#v}"
          gh release view "${TAG}" --json body --jq .body > notes.md
          if tr -d '\r' < notes.md | grep -qxF -- "${marker}"; then
            echo "The release notes already carry the install notice."
            exit 0
          fi
          cat >> notes.md <<NOTICE

          ${marker}
          ## Install

          \`figma-drop-${version}-mac-arm64.dmg\` is signed with a Developer ID and notarized by Apple, and it runs only on Apple silicon. Open it, drag \`figma-drop\` to Applications, and eject the disk image. Then open figma-drop from your Applications folder.

          \`figma-drop-figma-plugin-${version}.zip\` is a Figma development plugin. Unzip it. In the Figma desktop app, select **Plugins > Development > Import plugin from manifest**, then select its \`manifest.json\`.

          To check the downloads, run \`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\` in their folder. See [RELEASING.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/RELEASING.md).
          NOTICE
          gh release edit "${TAG}" --notes-file notes.md
