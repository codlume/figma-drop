name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Labels on the release PR go through the issues API.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The next release PR is opened in its own job, so its failure cannot skip the build of a
  # release that already exists. Nothing depends on it.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-please-pr-main
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # A tag pushed with GITHUB_TOKEN triggers no workflow, so the build runs in this run.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    # Notarization waits on Apple, which usually takes a few minutes.
    timeout-minutes: 60
    # The signing and notary secrets live in this environment, which only `main` may deploy to.
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Corepack installs the pnpm that `packageManager` pins.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      # The build runs before any secret is in reach. Only the signing step sees the credentials.
      - run: pnpm build
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="${RUNNER_TEMP}/figma-drop-signing.keychain-db"
          certificate="${RUNNER_TEMP}/figma-drop-signing.p12"
          trap 'rm -f "${certificate}"' EXIT
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate}"
          security import "${certificate}" -k "${keychain}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${certificate}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          identity="$(security find-identity -v -p codesigning "${keychain}" | sed -nE "s/^ *[0-9]+\) [0-9A-F]{40} \"(Developer ID Application: .* \(${APPLE_TEAM_ID}\))\"$/\1/p" | head -n 1)"
          if [ -z "${identity}" ]; then
            echo "The certificate holds no Developer ID Application identity for team ${APPLE_TEAM_ID}."
            exit 1
          fi
          echo "FIGMA_DROP_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - name: Sign, notarize, and staple the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package-local.mjs
      - run: node scripts/release-package.mjs --tag "${TAG}"
      - name: Delete the signing keychain
        if: always()
        run: |
          keychain="${RUNNER_TEMP}/figma-drop-signing.keychain-db"
          if [ -f "${keychain}" ]; then
            security delete-keychain "${keychain}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: |
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: release-artifacts
      - name: Verify the downloaded assets
        working-directory: release-artifacts
        run: |
          sha256sum -c SHA256SUMS.txt
          listed="$( (sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS.txt; echo SHA256SUMS.txt) | LC_ALL=C sort)"
          present="$(shopt -s dotglob nullglob; printf '%s\n' * | LC_ALL=C sort)"
          if [ "${present}" != "${listed}" ]; then
            printf 'The artifact must hold exactly SHA256SUMS.txt and the files it lists.\nListed:\n%s\nPresent:\n%s\n' "${listed}" "${present}"
            exit 1
          fi
      - name: Upload the release assets
        run: gh release upload "${TAG}" release-artifacts/* --clobber
      - name: Add the install notice to the release notes
        run: |
          marker='<!-- figma-drop-install-notice -->'
          version="${TAG#v}"
          gh release view "${TAG}" --json body --jq .body > notes.md
          if tr -d '\r' < notes.md | grep -qxF -- "${marker}"; then
            echo "The release notes already carry the install notice."
            exit 0
          fi
          cat >> notes.md <<NOTICE

          ${marker}
          ## Install

          \`figma-drop-${version}-mac-arm64.zip\` is signed with a Developer ID and notarized by Apple, and it runs only on Apple silicon. Unzip it, move \`figma-drop.app\` to your Applications folder, and open it.

          \`figma-drop-figma-plugin-${version}.zip\` is a Figma development plugin. Unzip it. In the Figma desktop app, select **Plugins > Development > Import plugin from manifest**, then select its \`manifest.json\`.

          To check the downloads, run \`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\` in their folder. See [RELEASING.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/RELEASING.md).
          NOTICE
          gh release edit "${TAG}" --notes-file notes.md
