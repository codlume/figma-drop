name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN triggers no workflow, so the build runs in this run.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm app:local
      - run: node scripts/release-package.mjs --tag "${TAG}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: |
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release-please.outputs.tag_name }}
          path: release-artifacts
      - name: Upload the release assets
        run: |
          version="${TAG#v}"
          gh release upload "${TAG}" \
            "release-artifacts/figma-drop-${version}-mac-arm64-unsigned.zip" \
            "release-artifacts/figma-drop-figma-plugin-${version}.zip" \
            release-artifacts/SHA256SUMS.txt \
            --clobber
      - name: Add the install notice to the release notes
        run: |
          marker='<!-- figma-drop-unsigned-notice -->'
          version="${TAG#v}"
          gh release view "${TAG}" --json body --jq .body > notes.md
          if grep -qF -- "${marker}" notes.md; then
            echo "The release notes already carry the install notice."
            exit 0
          fi
          cat >> notes.md <<NOTICE

          ${marker}
          ## Install

          \`figma-drop-${version}-mac-arm64-unsigned.zip\` is unsigned. It has an ad-hoc signature, Apple has not notarized it, and it runs only on Apple silicon. macOS blocks it the first time. After you unzip it, run \`xattr -dr com.apple.quarantine figma-drop.app\`. Or try to open it once, then select **Open Anyway** in System Settings > Privacy & Security.

          \`figma-drop-figma-plugin-${version}.zip\` is a Figma development plugin. Unzip it. In the Figma desktop app, select **Plugins > Development > Import plugin from manifest**, then select its \`manifest.json\`.

          To check the downloads, run \`shasum -a 256 -c SHA256SUMS.txt\` in their folder. See [RELEASING.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/RELEASING.md).
          NOTICE
          gh release edit "${TAG}" --notes-file notes.md
