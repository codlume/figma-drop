packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true # required: without it pnpm 11 exits 1 with ERR_PNPM_IGNORED_BUILDS
catalog:
  '@figma/plugin-typings': 1.142.0
  '@stylexjs/stylex': 0.19.1
  '@stylexjs/unplugin': 0.19.1
  '@testing-library/dom': 10.4.1
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/node': 24.12.4
  '@vitejs/plugin-react': 6.1.1
  effect: 4.1.4
  jsdom: 31.0.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  zod: 4.6.7
overrides:
  vite: 'catalog:'
packageExtensions:
  vite-plus@*:
    dependencies:
      vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
